name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter-tests:
    runs-on: golang
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Cache bucket date
        id: cache-date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # The key rotates daily, not per commit: a per-SHA key never hits the primary key, so every
      # push re-uploaded ~166 MB and the runner's cache store (GC'd only by age) grew unbounded.
      # Beware that `path` and the runner image's compression tools (gzip vs zstd) are part of the
      # entry's version hash, not of the key — changing either invalidates every existing entry.
      - name: Cache Go modules
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ hashFiles('go.sum') }}-${{ steps.cache-date.outputs.day }}
          restore-keys: |
            go-${{ hashFiles('go.sum') }}-
            go-

      - name: Download dependencies
        run: go mod download

      - name: go build
        run: go build ./...

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: govulncheck
        run: GOVERSION=$(go env GOVERSION | cut -d- -f1) govulncheck -show verbose ./...

      - name: Unit tests
        run: go test ./... -race

      # Explicit because of `set -o pipefail` below: it is a bash builtin, and the
      # step fails with an obscure error if the runner ever defaults to dash/sh.
      - name: Integration tests
        shell: bash
        run: |
          set -euo pipefail

          DOCKER_GW=$(ip route | awk '/^default/{print $3}')
          export DOCKER_HOST="tcp://${DOCKER_GW}:2375"
          export TESTCONTAINERS_HOST_OVERRIDE="${DOCKER_GW}"
          export TESTCONTAINERS_RYUK_CONTAINER_PRIVILEGED=true

          echo "docker daemon: ${DOCKER_HOST}"

          pkgs=$(grep -rl '^//go:build integration$' --include='*_test.go' . | xargs -n1 dirname | sort -u)

          # -p 1 serialises packages: each one starts its own Postgres, and dind is
          # capped at 1.5 CPU / 2.5 GB shared with this job.
          go test -tags=integration -race -p 1 -v $pkgs 2>&1 | tee integration.log

          # Every integration test opens with testcontainers.SkipIfProviderIsNotHealthy,
          # which turns an unreachable daemon into a SKIP -- and `go test` reports a
          # skipped package as `ok`. That is how these tests silently stopped running.
          # The project has no other t.Skip, so any skip at all means the daemon is gone.
          if grep -qE '^[[:space:]]*--- SKIP' integration.log; then
            echo "::error::Integration tests were skipped: the runner cannot reach the Docker daemon"
            grep -E '^[[:space:]]*--- SKIP' integration.log | head -20
            exit 1
          fi

  docker:
    runs-on: docker
    needs: linter-tests
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Build and push
        run: |
          export DOCKER_HOST=tcp://$(ip route | awk '/^default/{print $3}'):2375
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login git.sonuserver.com -u fortega21 --password-stdin
          IMAGE=git.sonuserver.com/fortega21/appointment-manager
          docker build -f docker/Dockerfile \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
