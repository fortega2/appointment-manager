services:
  server:
    container_name: appointment-manager
    hostname: server
    image: git.sonuserver.com/fortega21/appointment-manager:latest
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_USE_SSL: ${STORAGE_USE_SSL}
      WORKER_TICKER_INTERVAL: ${WORKER_TICKER_INTERVAL}
      METRICS_ADDR: ":${METRICS_PORT:-9090}"
      LOGIN_RATE_LIMIT_ENABLED: ${LOGIN_RATE_LIMIT_ENABLED:-true}
      LOGIN_RATE_LIMIT_ACCOUNT_BURST: ${LOGIN_RATE_LIMIT_ACCOUNT_BURST:-5}
      LOGIN_RATE_LIMIT_ACCOUNT_REFILL: ${LOGIN_RATE_LIMIT_ACCOUNT_REFILL:-3m}
      LOGIN_RATE_LIMIT_IP_BURST: ${LOGIN_RATE_LIMIT_IP_BURST:-20}
      LOGIN_RATE_LIMIT_IP_REFILL: ${LOGIN_RATE_LIMIT_IP_REFILL:-30s}
      LOGIN_RATE_LIMIT_MAX_ENTRIES: ${LOGIN_RATE_LIMIT_MAX_ENTRIES:-10000}
      # APP_BASE_URL, SMTP_HOST and SMTP_FROM_ADDRESS carry no default on
      # purpose: the server refuses to start without them, because password
      # reset is the only recovery path and booting without it would leave the
      # account unrecoverable and say nothing. See ADR 0010.
      APP_BASE_URL: ${APP_BASE_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      PASSWORD_RESET_TOKEN_TTL: ${PASSWORD_RESET_TOKEN_TTL:-30m}
      PASSWORD_RESET_RATE_LIMIT_ACCOUNT_BURST: ${PASSWORD_RESET_RATE_LIMIT_ACCOUNT_BURST:-3}
      PASSWORD_RESET_RATE_LIMIT_ACCOUNT_REFILL: ${PASSWORD_RESET_RATE_LIMIT_ACCOUNT_REFILL:-15m}
      PASSWORD_RESET_RATE_LIMIT_IP_BURST: ${PASSWORD_RESET_RATE_LIMIT_IP_BURST:-10}
      PASSWORD_RESET_RATE_LIMIT_IP_REFILL: ${PASSWORD_RESET_RATE_LIMIT_IP_REFILL:-5m}
      GOMAXPROCS: "2"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLE_RATIO: ${OTEL_TRACES_SAMPLE_RATIO:-1.0}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-}
      OUTBOX_DRAIN_INTERVAL: ${OUTBOX_DRAIN_INTERVAL:-15s}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      DB_POOL_MAX_CONNS: ${DB_POOL_MAX_CONNS:-5}
      DB_POOL_MIN_CONNS: ${DB_POOL_MIN_CONNS:-1}
      DB_POOL_MAX_CONN_LIFETIME: ${DB_POOL_MAX_CONN_LIFETIME:-30m}
      DB_POOL_MAX_CONN_LIFETIME_JITTER: ${DB_POOL_MAX_CONN_LIFETIME_JITTER:-5m}
      DB_POOL_MAX_CONN_IDLE_TIME: ${DB_POOL_MAX_CONN_IDLE_TIME:-5m}
      DB_POOL_HEALTH_CHECK_PERIOD: ${DB_POOL_HEALTH_CHECK_PERIOD:-30s}
    networks:
      - caddy_network
      - monitoring_network
      - backend_network
    expose:
      - ${API_PORT:-8080}
      - ${METRICS_PORT:-9090}
    restart: unless-stopped
    # Longer than the reset drain in cmd/server/main.go; the default 10s would
    # SIGKILL the process mid-drain whenever the relay is slow.
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 3G

  postgres:
    container_name: appointment-manager-postgres
    hostname: postgres
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - backend_network
    expose:
      - ${POSTGRES_PORT:-5432}
    volumes:
      - postgres_data:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 3G

volumes:
  postgres_data:
    name: appointment-manager-postgres-data

networks:
  caddy_network:
    external: true
  monitoring_network:
    external: true
  backend_network:
    internal: true
