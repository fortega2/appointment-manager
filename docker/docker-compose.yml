services:
  server:
    container_name: appointment-manager
    hostname: server
    image: git.sonuserver.com/fortega21/appointment-manager:latest
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_USE_SSL: ${STORAGE_USE_SSL}
      WORKER_TICKER_INTERVAL: ${WORKER_TICKER_INTERVAL}
      METRICS_ADDR: ":${METRICS_PORT:-9090}"
      LOGIN_RATE_LIMIT_ENABLED: ${LOGIN_RATE_LIMIT_ENABLED:-true}
      LOGIN_RATE_LIMIT_ACCOUNT_BURST: ${LOGIN_RATE_LIMIT_ACCOUNT_BURST:-5}
      LOGIN_RATE_LIMIT_ACCOUNT_REFILL: ${LOGIN_RATE_LIMIT_ACCOUNT_REFILL:-3m}
      LOGIN_RATE_LIMIT_IP_BURST: ${LOGIN_RATE_LIMIT_IP_BURST:-20}
      LOGIN_RATE_LIMIT_IP_REFILL: ${LOGIN_RATE_LIMIT_IP_REFILL:-30s}
      LOGIN_RATE_LIMIT_MAX_ENTRIES: ${LOGIN_RATE_LIMIT_MAX_ENTRIES:-10000}
      GOMAXPROCS: "2"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLE_RATIO: ${OTEL_TRACES_SAMPLE_RATIO:-1.0}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-}
      NOTIFICATION_TICKER_INTERVAL: ${NOTIFICATION_TICKER_INTERVAL:-1m}
      NOTIFICATION_BUFFER_SIZE: ${NOTIFICATION_BUFFER_SIZE:-100}
      DB_POOL_MAX_CONNS: ${DB_POOL_MAX_CONNS:-5}
      DB_POOL_MIN_CONNS: ${DB_POOL_MIN_CONNS:-1}
      DB_POOL_MAX_CONN_LIFETIME: ${DB_POOL_MAX_CONN_LIFETIME:-30m}
      DB_POOL_MAX_CONN_LIFETIME_JITTER: ${DB_POOL_MAX_CONN_LIFETIME_JITTER:-5m}
      DB_POOL_MAX_CONN_IDLE_TIME: ${DB_POOL_MAX_CONN_IDLE_TIME:-5m}
      DB_POOL_HEALTH_CHECK_PERIOD: ${DB_POOL_HEALTH_CHECK_PERIOD:-30s}
    networks:
      - caddy_network
      - monitoring_network
      - backend_network
    expose:
      - ${API_PORT:-8080}
      - ${METRICS_PORT:-9090}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 3G

  postgres:
    container_name: appointment-manager-postgres
    hostname: postgres
    image: postgres:18.3-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - backend_network
    expose:
      - ${POSTGRES_PORT:-5432}
    volumes:
      - postgres_data:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 3G

volumes:
  postgres_data:
    name: appointment-manager-postgres-data

networks:
  caddy_network:
    external: true
  monitoring_network:
    external: true
  backend_network:
    internal: true
